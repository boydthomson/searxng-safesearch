  # a child the picture with no snippet, no domain and no context to soften it,
  # so terms that merely produce awkward text results are refused as pictures.
  # These are deliberately *not* blocked for ordinary web search: a kid reading
  # about swimwear or human anatomy is fine, a grid of images of it is not.
  - id: images_strict
    tier: 2
    action: block
    scope: images
    label: Not available as image search
    safe:
      - '\b(bird|fish|insect|animal|plant|flower|tree|rock|mineral|cloud|planet|galaxy|dinosaur|volcano|castle|flag|map|diagram|graph|skeleton|cell|atom|molecule)\b'
      - '\b(anatomy|biology|science|medical|textbook|diagram|for kids|history of|renaissance|museum|painting|sculpture)\b'
      - '\b(swimming|swim) (lessons?|class(es)?|team|practice|club|meet|goggles|cap)\b'
      - '\b(sports? ?bra|life ?jacket|wet ?suit|uniform|costume|halloween)\b'
    any:
      - '\b(bikini|swimsuit|swimwear|lingerie|underwear|panties|thong|bra|corset|negligee)\b'
      - '\b(cleavage|midriff|upskirt|downblouse|see ?through|wet t ?shirt|camel toe)\b'
      - '\b(shirtless|topless|bottomless|undressed|undressing|changing room|locker room)\b'
      - '\b(hot|sexy|attractive|beautiful|pretty) (girls?|boys?|women|men|models?|teens?|babes?)\b'
      - '\b(model|models|modelling|modeling) (photo|photos|shoot|pics?|gallery)\b'
      - '\b(body|butt|booty|abs|six pack|thigh|legs|feet|foot) (pics?|photos?|goals)\b'
      - '\b(bed|bedroom|shower|bath|bathtub|pool) (selfie|pics?|photos?)\b'
      - '\b(girls?|boys?|women|men) in (bikinis?|underwear|lingerie|swimsuits?)\b'
      - '\b(anime|manga|waifu) (girl|girls|babe|thicc|curvy)\b'
      - '\b(gore|blood|wound|injury|surgery|autopsy|corpse|dead body|carcass|roadkill)\b'
      - '\b(scary|disturbing|cursed|creepy|nightmare fuel) (images?|pics?|photos?)\b'
    fuzzy: []

