# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Category lexicons for the the safe-search instance child-safety classifier.
#
#   tier    1 = zero tolerance (must never leak), 2 = strict
#   action  crisis | block          (what L2 does with a matching *query*)
#   safe    regexes that VETO a hit for this category (benign/clinical context)
#   any     regexes; a match on any normalised query variant is a hit
#   combo   {verbs, nouns}; hit when a verb AND a noun both appear
#   squeeze tokens matched against the separator-free form; must be long and
#           unambiguous, because "sex" would otherwise fire inside "essex"
#
# Regexes run against lowercased, accent-folded, de-leeted variants, so write
# them in plain lowercase ASCII.

version: 3

categories:

  # ---------------------------------------------------------------- tier 1 --
  - id: self_harm
