      - '\bhow to (make|tie) a noose\b'
      - '\b(hurt|harm|injure|damage|starve|poison|drown|suffocate|choke) (my|your|him|her|them|one)\s?sel(f|ves)\b'
      - '\bover ?dos(e|ing) (on|with)\b'
