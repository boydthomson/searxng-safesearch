# Example SearXNG settings for the child-safety filter.
# Copy to /etc/searxng/settings-safe.yml and set secret_key, base_url and
# instance_name for your deployment.
#
# SearXNG binds loopback only -- the guard (safeguard.proxy) owns the public
# port and proxies to it.
#
# Engine list: Wikimedia Commons images are left out on purpose -- Commons has
# no safe-search switch at all and hosts explicit media.  DuckDuckGo's safe
# search is not fully reliable; it is kept for result coverage and its results
# are still filtered by Layer 4.
use_default_settings:
  engines:
    keep_only:
      - google
      - google images
      - bing images
      - qwant images
      - brave.images
      - google scholar
      - duckduckgo
      - brave
      - mojeek
      - qwant
      - startpage
      - bing
      - wikipedia
      - wikidata
      - stackoverflow
      - askubuntu
      - superuser
      - mdn
      - gentoo
      - arch linux wiki
      - openairedatasets
      - openairepublications
      - semantic scholar
      - pubmed

general:
  debug: false
  instance_name: "Safe Search"   # shown in the UI; match SAFEGUARD_BRAND
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true

search:
  formats:
    - html
    - json
  safe_search: 2
  autocomplete: "google"
  default_lang: "en"

# Layer 5: images are enabled, video is not.  A thumbnail grid is the highest
# risk surface -- a single miss lands the picture in front of the child with no
# snippet or domain to soften it -- so it carries extra protection:
#   * only engines that enforce safe search server-side are routed here
#   * the guard applies the `images_strict` lexicon on top of the general one
#   * image_proxy stays ON so every thumbnail passes through the guard, which
#     checks it against the 4.1M-host blocklist before serving it
#   * the L4 plugin scores img_src / thumbnail_src, not just the result URL
# Video stays off: autoplay, far weaker safe-search enforcement, and no
# equivalent of a thumbnail check.
categories_as_tabs:
  general:
  images:
  science:
  it:

server:
  base_url: "https://safesearch.example.com/"
  port: 8899
  bind_address: "127.0.0.1"
  secret_key: "CHANGE_ME_generate_with_openssl_rand_hex_32"
  # The limiter stays off: it needs a Valkey instance, and clients arrive via
  # the guard on loopback anyway.  The guard refuses json/csv/rss to anything
  # but this machine (SAFEGUARD_JSON_CLIENTS), which is what stops the instance
  # being scraped as a free API.
  limiter: false
  image_proxy: true
  public_instance: false

ui:
  static_path: /usr/local/searxng/static-safe
  templates_path: /usr/local/searxng/templates-safe
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: auto

# NOTE: `enabled_plugins:` is dead configuration in SearXNG 2026.x -- it is
# silently ignored and the defaults are used.  The current key is `plugins:`.
plugins:
  searx.plugins.child_safety.SXNGPlugin:      # Layer 4 -- result post-filter
    active: true
  searx.plugins.hostnames.SXNGPlugin:         # Layer 3 -- curated host regexes
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true

# Layer 3: curated host list, regenerated by bin/refresh_blocklists.py.  The
# full multi-million-host set is enforced by the child_safety plugin instead --
# this plugin compiles one regex per entry, so it stays small on purpose.
hostnames:
  remove: 'blocked-hosts.yml'

preferences:
  lock:
    # NOTE: do NOT lock "categories" -- it pins the category to the default and
    # silently disables the tabs, so image search returns web results.  The
    # guard whitelists categories itself (proxy.ALLOWED_CATEGORIES), so the
    # lock buys nothing.
    - safesearch
    - language
    - locale
    - autocomplete
    - method
    - image_proxy
    - engines

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  retries: 1
  enable_http2: true

engines:
  - name: google images
    categories: [images]
    disabled: false
  - name: bing images
    categories: [images]
    disabled: false
  - name: qwant images
    categories: [images]
    disabled: false
  - name: brave.images
    categories: [images]
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
    weight: 1.5
  - name: brave
    disabled: false
    weight: 1.3
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
